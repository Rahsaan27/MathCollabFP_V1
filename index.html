<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My AI Model</title>
</head>
<body>

    <div>Teachable Machine Image Model</div>
    
    <!-- File upload input instead of webcam -->
    <input type="file" accept="image/*" onchange="handleUpload(event)">
    <br><br>
    
    <!-- Preview the uploaded image -->
    <img id="preview" src="" width="200" height="200" style="display:none;">
    <br>
    
    <!-- Results show up here -->
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">

        const URL = "https://teachablemachine.withgoogle.com/models/DY7pFRNqM/";
        let model, maxPredictions;

        // Load the model once when the page loads
        async function loadModel() {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            // Set up the label container
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            console.log("Model ready!");
        }

        // Called when user picks a file
        async function handleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Show a preview of the image
            const img = document.getElementById("preview");
            img.src = URL.createObjectURL(file);
            img.style.display = "block";

            // Wait for the image to fully load before predicting
            img.onload = async function() {
                const prediction = await model.predict(img);
                for (let i = 0; i < maxPredictions; i++) {
                    const classPrediction =
                        prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                    labelContainer.childNodes[i].innerHTML = classPrediction;
                }
            }
        }
        //testing

        // Load model immediately when page opens
        loadModel();

    </script>

</body>
</html>
